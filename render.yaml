# One-click setup for Render. A disk is required: without it the database is
# wiped on every redeploy.
services:
  - type: web
    name: mystery-networking
    runtime: node
    plan: starter               # free plans cannot mount a disk
    buildCommand: ""            # no dependencies to install
    startCommand: node server/index.js
    healthCheckPath: /api/session
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
