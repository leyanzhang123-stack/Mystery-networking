<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Welcome · Mystery Networking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23FCFCFB'/><rect x='3' y='6' width='3' height='3' fill='%230E0E12'/><rect x='10' y='6' width='3' height='3' fill='%238B5CF6'/></svg>" />
<link rel="stylesheet" href="/assets/ui.css" />
</head>
<body>
<script src="/assets/pixel.js"></script>
<script src="/assets/grain.js"></script>
<script src="/assets/motion.js"></script>
<script src="/assets/app.js"></script>
<style>
  .screen{min-height:calc(100svh - 150px);display:flex;flex-direction:column;padding:26px 0 34px}
  .screen .spacer{flex:1;min-height:20px}
  .cast{display:flex;gap:10px;justify-content:center;margin:6px 0 0}
  .cast .px-tile{width:74px}
  .tabs{display:flex;gap:0;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
  .tabs button{flex:1;background:transparent;border:0;padding:12px;font-weight:600;font-size:13px;cursor:pointer;
               color:var(--ink-3);transition:.25s var(--ease)}
  .tabs button.on{background:var(--ink);color:#fff}
</style>
<script>
(async function(){
  const s = await APP.guard('public'); if(!s) return;
  const view = APP.shell({ right: 'RESTO 2027' });
  const cast = PIXEL.catalogue(60);
  const three = [11,28,46].map(i => '<div class="px-tile">'+PIXEL.svg(cast[i].spec,{level:3,googly:true})+'</div>').join('');

  function form(mode){
    return '<div class="stack sm" data-rise="200">'+
      '<div class="tabs">'+
        '<button id="tab-up" class="'+(mode==='up'?'on':'')+'">Create account</button>'+
        '<button id="tab-in" class="'+(mode==='in'?'on':'')+'">Sign in</button>'+
      '</div>'+
      '<label class="field"><span class="label">Email</span>'+
        '<input type="email" id="email" autocomplete="email" placeholder="you@school.fi" /></label>'+
      '<label class="field"><span class="label">Password</span>'+
        '<input type="password" id="password" autocomplete="'+(mode==='up'?'new-password':'current-password')+'" placeholder="At least 6 characters" /></label>'+
      '<button class="btn wide" id="submit">'+(mode==='up'?'Create my account':'Sign in')+'</button>'+
      '<p class="tiny" style="margin:2px 0 0">Use the email you gave on the sign-up form, so we can find you.</p>'+
    '</div>';
  }

  function draw(mode){
    APP.render(
      '<div class="screen">'+
        '<span class="label on" data-rise>RESTO 2027 · Helsinki</span>'+
        '<h1 class="display" style="margin-top:18px">Two people at RESTO are about to <span class="serif">meet you.</span></h1>'+
        '<p class="lead" data-rise="380">You will not know who they are. They will not know who you are. Three small missions, eight weeks, and then March.</p>'+
        '<div class="cast" data-rise="440">'+three+'</div>'+
        '<div class="spacer"></div>'+
        form(mode)+
      '</div>', function(){
        document.getElementById('tab-up').onclick = () => draw('up');
        document.getElementById('tab-in').onclick = () => draw('in');
        const submit = document.getElementById('submit');
        const send = async () => {
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          submit.disabled = true;
          try {
            const r = await APP.api(mode==='up' ? '/api/register' : '/api/login', { email, password });
            location.href = r.user && r.user.profileDone ? '/hub.html' : '/onboarding.html';
          } catch (err) {
            APP.toast(err.message); submit.disabled = false;
          }
        };
        submit.onclick = send;
        document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
      });
  }
  draw('up');
})();
</script>
</body></html>
