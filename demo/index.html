<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mystery Networking — RESTO 2027</title>
<meta name="description" content="Interactive prototype of the Mystery Networking participant journey for RESTO 2027." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23F5F4EF'/><rect x='3' y='6' width='3' height='3' fill='%2314151A'/><rect x='10' y='6' width='3' height='3' fill='%230E7C5A'/></svg>" />
<link rel="stylesheet" href="assets/ui.css" />
<style>
  .demo-bar{position:sticky;top:0;z-index:60;background:var(--ink);color:rgba(245,244,239,.6);
    font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase}
  .demo-bar .inner{width:min(1180px,100%);margin:0 auto;padding:9px clamp(22px,5vw,64px);
    display:flex;align-items:center;gap:12px}
  .demo-bar button{background:transparent;color:rgba(245,244,239,.7);border:1px solid rgba(245,244,239,.25);
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:4px 10px;cursor:pointer;transition:.25s var(--ease)}
  .demo-bar button:hover{color:#fff;border-color:rgba(245,244,239,.6)}
  .swatches{display:flex;gap:5px}
  .swatch{width:14px;height:14px;border:1px solid rgba(245,244,239,.3);cursor:pointer;padding:0;
    transition:transform .25s var(--ease)}
  .swatch:hover{transform:scale(1.25)}
  .topbar{top:33px}

  .hero{min-height:calc(100svh - 200px);display:flex;flex-direction:column;justify-content:center;padding:40px 0}
  .hero h1{max-width:17ch}
  .hero p{max-width:46ch}
  .hero .btn{align-self:flex-start}

  .toast{position:fixed;right:clamp(16px,4vw,44px);bottom:clamp(16px,4vw,44px);
    width:min(320px,calc(100vw - 32px));background:var(--paper-2);border:1px solid var(--line);
    padding:18px;z-index:50;box-shadow:0 20px 50px -30px rgba(20,21,26,.5);
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);
    animation:toastIn .8s var(--ease) .6s both}
  .toast-bar{position:absolute;left:0;top:0;height:2px;width:44%;background:var(--accent)}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .conn{display:flex;align-items:center;gap:16px;padding:16px;background:var(--paper-2);
    border:1px solid var(--line);cursor:pointer;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
    transition:transform .4s var(--ease), border-color .3s var(--ease)}
  .conn:hover{transform:translateX(6px);border-color:var(--line-2)}
  .conn.on{border-color:var(--accent-line);background:var(--accent-soft)}

  .bub{max-width:78%;padding:12px 15px;font-size:14.5px;line-height:1.5;margin-bottom:10px;
    background:var(--paper-3);opacity:0;transform:translateY(10px);transition:.55s var(--ease)}
  .bub.in{opacity:1;transform:none}
  .bub.me{margin-left:auto;background:var(--ink);color:var(--paper)}

  .found{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);
    opacity:0;transform:translateX(-10px);transition:.55s var(--ease)}
  .found.in{opacity:1;transform:none}
  .found .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--accent);min-width:24px}

  .portrait{width:min(230px,62vw);aspect-ratio:1;background:var(--paper-3);border:1px solid var(--line);
    padding:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}

  .count{font-family:var(--display);font-weight:600;font-size:clamp(90px,26vw,170px);letter-spacing:-.06em;
    text-align:center;line-height:1.2;color:var(--accent);animation:pop .5s var(--ease) both}

  .splash{position:fixed;inset:0;z-index:80;background:var(--ink);color:var(--paper);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;
    opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
  .splash.on{opacity:1}
  .splash h1{font-size:clamp(42px,12vw,110px);margin:0;line-height:.95;color:var(--paper)}

  .duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
  .duo > .label{white-space:nowrap;align-self:center}
  .who{text-align:center}
</style>
</head>
<body>
<canvas id="field"></canvas>

<div class="page">
  <div class="demo-bar">
    <div class="inner">
      <span>Demo mode</span>
      <span class="grow"></span>
      <span class="swatches" id="swatches"></span>
      <button id="howBtn">About</button><button id="resetBtn">Restart</button>
    </div>
  </div>

  <div class="topbar">
    <div class="inner">
      <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span> Mystery Networking</div>
      <span class="grow"></span>
      <span class="label" id="stepLabel">Mission 0 / 3</span>
    </div>
    <div class="steps" style="width:min(1180px,100%);margin:0 auto;padding:0 clamp(22px,5vw,64px) 14px" id="steps">
      <span class="step"><i></i></span><span class="step"><i></i></span><span class="step"><i></i></span>
    </div>
  </div>

  <div class="wrap" id="app"></div>
</div>

<div class="splash" id="splash">
  <span class="label" style="color:rgba(245,244,239,.5)">Helsinki · 12 March 2027</span>
  <h1 class="display">Tonight you meet them.</h1>
</div>
<div class="confetti" id="confetti"></div>

<script src="assets/pixel.js"></script>
<script src="assets/halftone.js"></script>
<script src="assets/motion.js"></script>
<script>
(function(){
"use strict";

HALFTONE.mount(document.getElementById('field'), { gap:17, maxR:2.6, colour:'20,21,26' });
MOTION.pointer();

var cast = PIXEL.catalogue(60);
function byHandle(h){ for(var i=0;i<cast.length;i++) if(cast[i].handle===h) return cast[i]; return cast[0]; }

var ME    = { handle:'Compass',  real:'Emma', spec:byHandle('Compass').spec };
var THEM  = { handle:'Meridian', real:'Alex', spec:byHandle('Meridian').spec };
var OTHER = { handle:'Lantern',  real:'Noor', spec:byHandle('Lantern').spec };

var MISSIONS=[
  {n:'01', t:'Find three things you both like', w:'Week 3'},
  {n:'02', t:'Two truths and a lie',            w:'Week 5'},
  {n:'03', t:'Three clues so they can find you',w:'Week 7'}
];
var REWARDS=[
  {ic:'01', t:'First word'},
  {ic:'02', t:'Common ground'},
  {ic:'03', t:'Called the lie'},
  {ic:'04', t:'Clues sent'},
  {ic:'★',  t:'Met in person'}
];

var state={ tasks:0, rewards:1 };

var app=document.getElementById('app');
var stepsEl=document.getElementById('steps');
var stepLabel=document.getElementById('stepLabel');
var splash=document.getElementById('splash');
var confettiEl=document.getElementById('confetti');

function px(spec,opts){ return PIXEL.svg(spec,opts||{}); }

function progress(){
  for(var i=0;i<3;i++) stepsEl.children[i].className='step'+(i<state.tasks?' done':(i===state.tasks?' now':''));
  stepLabel.textContent='Mission '+state.tasks+' / 3';
}

/** Every screen change goes behind the curtain, then replays its entrance. */
function show(html){
  MOTION.transition(function(){
    app.innerHTML=html;
    progress();
    MOTION.observe(app);
    MOTION.magnetic(app);
    PIXEL.trackEyes(document);
    var h=app.querySelector('h1.display, h2.display');
    if(h) requestAnimationFrame(function(){ MOTION.playLines(h, 120); });
    var r=app.querySelector('.ring-wrap');
    if(r) MOTION.ring(r, state.tasks/3);
    var c=app.querySelector('[data-count]');
    if(c) MOTION.countUp(c, Number(c.getAttribute('data-count')), 1200);
  });
}
function on(id,fn){ var el=document.getElementById(id); if(el) el.onclick=fn; return el; }
function seq(list,cls,gap,done){
  var i=0;(function step(){ if(i>=list.length){ if(done) done(); return; } list[i].classList.add(cls); i++; setTimeout(step,gap); })();
}
function confetti(n){
  var cols=['#0E7C5A','#FF6B5A','#4EA8F0','#FFC93C','#14151A'];
  for(var i=0;i<(n||60);i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%'; p.style.top=(-16-Math.random()*50)+'px';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.5)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    confettiEl.appendChild(p);
    (function(n){setTimeout(function(){n.remove();},4200);})(p);
  }
}

/* the four gamification pillars, rendered as one panel */
function gamePanel(){
  return '<div class="card" data-rise="60">'+
    '<div class="spread" style="margin-bottom:18px">'+
      '<span class="label">Your journey</span>'+
      '<span class="label on">'+state.tasks+' of 3 missions</span></div>'+
    '<div class="meter" style="margin-bottom:22px">'+
      '<div class="ring-wrap"><svg class="ring" viewBox="0 0 60 60">'+
        '<circle class="ring-bg" cx="30" cy="30" r="26"></circle>'+
        '<circle class="ring-fill" cx="30" cy="30" r="26"></circle></svg>'+
        '<span class="ring-label">'+Math.round(state.tasks/3*100)+'%</span></div>'+
      '<div><h3 class="display" style="margin:0 0 3px">'+
        (state.tasks===3?'Ready for Helsinki':'Keep talking')+'</h3>'+
        '<span class="tiny">Two connections &middot; <span data-count="'+(state.tasks*14+6)+'">0</span> messages sent</span></div>'+
    '</div>'+
    MISSIONS.map(function(m,i){
      return '<div class="mission'+(i<state.tasks?' done':'')+'">'+
        '<span class="box">'+(i<state.tasks?'&#10003;':m.n)+'</span>'+
        '<span class="grow"><span class="m-title">'+m.t+'</span></span>'+
        '<span class="label">'+m.w+'</span></div>';
    }).join('')+
    '<hr class="rule" style="margin:18px 0 14px" />'+
    '<span class="label" style="display:block;margin-bottom:12px">Stamps earned</span>'+
    '<div class="rewards">'+
      REWARDS.map(function(r,i){
        return '<div class="reward'+(i<state.rewards?' got':'')+'">'+
          '<span class="ic">'+(i<state.rewards?r.ic:'&#183;')+'</span><span>'+r.t+'</span></div>';
      }).join('')+
    '</div>'+
  '</div>';
}

var S={};

/* 1 — welcome */
S.welcome=function(){
  show(
  '<div class="hero">'+
    '<span class="label on" style="margin-bottom:26px" data-rise>RESTO 2027 &middot; Helsinki</span>'+
    '<h1 class="display">Two people at RESTO are about to meet you.</h1>'+
    '<p class="lead" data-rise="420">You will not know who they are. They will not know who you are. Eight weeks of that, and then March.</p>'+
    '<div data-rise="540"><button class="btn" id="go">Create my account</button></div>'+
  '</div>'+
  '<div class="toast">'+
    '<div class="toast-bar"></div>'+
    '<div class="spread"><span class="label on">Signed in</span><span class="label">52 days to go</span></div>'+
    '<div class="row" style="margin-top:14px">'+
      '<div class="px-tile bare" style="width:54px;flex:0 0 auto">'+px(ME.spec,{level:3,googly:true})+'</div>'+
      '<div><h3 class="display" style="margin:0 0 2px">Compass</h3>'+
      '<span class="tiny">Real name sealed until the welcome evening.</span></div></div>'+
  '</div>');
  on('go', S.matching);
};

/* 2 — matching */
S.matching=function(){
  show(
  '<div class="stack center section" style="min-height:62svh;justify-content:center;align-items:center">'+
    '<div class="px-tile float" style="width:130px">'+px(THEM.spec,{level:3})+'</div>'+
    '<h2 class="display" id="mt" style="margin-top:34px">Looking for someone</h2>'+
    '<p class="lead" id="ms" style="margin:0">312 people signed up. One of them is yours.</p>'+
  '</div>');
  var lines=[
    ['Looking for someone','312 people signed up. One of them is yours.'],
    ['Checking you two have never met','Nobody is matched with their own classmates.'],
    ['Found them','One pick each. No swapping, no take-backs.']
  ];
  var i=0;
  var iv=setInterval(function(){
    i++;
    var mt=document.getElementById('mt'), ms=document.getElementById('ms');
    if(!mt){ clearInterval(iv); return; }
    if(i>=lines.length){ clearInterval(iv); setTimeout(S.matched,900); return; }
    mt.textContent=lines[i][0]; ms.textContent=lines[i][1];
    mt.removeAttribute('data-split');
    MOTION.playLines(mt,0);
    ms.classList.remove('pop'); void ms.offsetWidth; ms.classList.add('pop');
  },1350);
};

/* 3 — two connections (social) + the journey panel */
S.matched=function(){
  show(
  '<div class="narrow section">'+
    '<span class="tag on" data-rise><span class="dot live"></span> Week 2</span>'+
    '<h1 class="display" style="margin-top:22px">You picked Meridian!</h1>'+
    '<p class="lead" data-rise="380">And someone picked you. Two people to talk to before March, and neither of them has any idea who you are.</p>'+
    '<div class="stack sm" style="margin-bottom:22px">'+
      '<div class="conn on" data-rise="440">'+
        '<div class="px-tile bare" style="width:60px;flex:0 0 auto">'+px(THEM.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">Meridian</h3><span class="label">You picked them</span></div>'+
        '<span class="label on">New</span></div>'+
      '<div class="conn" data-rise="520">'+
        '<div class="px-tile bare" style="width:60px;flex:0 0 auto">'+px(OTHER.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">Lantern</h3><span class="label">They picked you</span></div>'+
        '<span class="label">Say hi</span></div>'+
    '</div>'+
    '<div class="note on" data-rise="580"><b>House rule</b>No names, no schools, no photos, no Instagram. If it slips out, you have spoiled your own reveal.</div>'+
    '<div style="margin:22px 0" data-rise="640">'+gamePanel()+'</div>'+
    '<button class="btn" id="go" data-rise="680">Start talking</button>'+
  '</div>');
  on('go', S.task1);
};

/* 4 — mission 1: mutual interests, found by talking */
S.task1=function(){
  show(
  '<div class="narrow section">'+
    '<div class="spread" data-rise><span class="label on">Mission 01 &middot; Week 3</span><span class="label">With Meridian</span></div>'+
    '<h1 class="display" style="margin-top:18px">Find three things you both like.</h1>'+
    '<p class="lead" data-rise="380">Films, food, terrible taste in music. Anything, as long as you both actually mean it. Just talk until you get there.</p>'+
    '<div class="card flat" id="chat" data-rise="420" style="background:none;border:0;padding:0">'+
      '<div class="bub">so. eight weeks of this and i cannot even ask your name</div>'+
      '<div class="bub me">ask me something better then</div>'+
      '<div class="bub">fine. worst airport coffee you have ever paid actual money for</div>'+
      '<div class="bub me">Helsinki T2, gate 24. I would defend it in court</div>'+
      '<div class="bub">unbelievable. that is one thing in common and it is a bad opinion</div>'+
    '</div>'+
    '<div class="card" id="found" style="margin-top:20px" data-rise="460">'+
      '<span class="label">Found together</span>'+
      '<div class="found" style="margin-top:8px"><span class="k">01</span><span class="small">Coffee, defended badly</span></div>'+
      '<div class="found"><span class="k">02</span><span class="small">Both interrailed last summer, three days apart</span></div>'+
      '<div class="found"><span class="k">03</span><span class="small">Flow Festival, already in both calendars</span></div>'+
    '</div>'+
    '<div id="after" style="margin-top:20px"></div>'+
    '<div style="margin-top:22px"><button class="btn" id="go">Play the conversation</button></div>'+
  '</div>');
  var btn=document.getElementById('go');
  btn.onclick=function(){
    if(btn.dataset.done){ S.task2(); return; }
    btn.disabled=true; btn.textContent='Talking…';
    seq([].slice.call(document.querySelectorAll('.bub')),'in',640,function(){
      seq([].slice.call(document.querySelectorAll('.found')),'in',540,function(){
        state.tasks=1; state.rewards=2; progress(); confetti(26);
        document.getElementById('after').innerHTML=
          '<div class="note on pop"><b>Three things. Not bad for two strangers!</b>Mission 01 complete for both of you. Stamp earned: Common ground.</div>';
        btn.disabled=false; btn.textContent='Continue'; btn.dataset.done='1';
      });
    });
  };
};

/* 5 — mission 2 */
S.task2=function(){
  show(
  '<div class="narrow section">'+
    '<div class="spread" data-rise><span class="label on">Mission 02 &middot; Week 5</span><span class="label">With Meridian</span></div>'+
    '<h1 class="display" style="margin-top:18px">Two truths and a lie.</h1>'+
    '<p class="lead" data-rise="380">Send three things about yourself. Two true, one invented. See if they can spot it.</p>'+
    '<div class="card stack sm" data-rise="430">'+
      '<label class="field"><span class="label">Statement 01</span><input type="text" value="I have broken the same finger three times" /></label>'+
      '<label class="field"><span class="label">Statement 02</span><input type="text" value="I once served a table of forty on my own" /></label>'+
      '<label class="field"><span class="label">Statement 03</span><input type="text" value="I can sleep through absolutely anything" /></label>'+
    '</div>'+
    '<div id="after" style="margin-top:20px"></div>'+
    '<div style="margin-top:22px"><button class="btn" id="go">Send all three</button></div>'+
  '</div>');
  var btn=document.getElementById('go');
  btn.onclick=function(){
    if(btn.dataset.done){ S.task3(); return; }
    state.tasks=2; state.rewards=3; progress(); confetti(26);
    document.getElementById('after').innerHTML=
      '<div class="stack sm">'+
        '<div class="note on pop"><b>Meridian guessed the finger!</b>Wrong. It was the table of forty. Stamp earned: Called the lie.</div>'+
        '<div class="card pop row">'+
          '<div class="px-tile bare" style="width:58px;flex:0 0 auto">'+px(THEM.spec,{level:3,googly:true})+'</div>'+
          '<div><span class="label">Meridian</span><p class="small" style="margin:5px 0 0">'+
          '&ldquo;you absolutely cannot sleep through anything, nobody can, this is a lie too&rdquo;</p></div></div>'+
      '</div>';
    btn.textContent='Continue'; btn.dataset.done='1';
  };
};

/* 6 — mission 3 */
S.task3=function(){
  show(
  '<div class="narrow section">'+
    '<div class="spread" data-rise><span class="label on">Mission 03 &middot; Week 7</span><span class="label">With Meridian</span></div>'+
    '<h1 class="display" style="margin-top:18px">Three clues so they can find you.</h1>'+
    '<p class="lead" data-rise="380">On the night you get about five minutes to spot each other in a room full of people. Be specific.</p>'+
    '<div class="card stack sm" data-rise="430">'+
      '<label class="field"><span class="label">Clue 01</span><input type="text" value="Red scarf. I will not take it off all evening" /></label>'+
      '<label class="field"><span class="label">Clue 02</span><input type="text" value="About 1.60m, so probably below your eye level" /></label>'+
      '<label class="field"><span class="label">Clue 03</span><input type="text" value="Hovering near the coffee. Always near the coffee" /></label>'+
      '<p class="tiny" style="margin:0">Not useful: &ldquo;I have brown hair.&rdquo; Everyone has brown hair.</p>'+
    '</div>'+
    '<div id="after" style="margin-top:20px"></div>'+
    '<div style="margin-top:22px"><button class="btn" id="go">Send my clues</button> '+
      '<button class="linkbtn" id="skip" style="display:none">Skip to the welcome evening</button></div>'+
  '</div>');
  var btn=document.getElementById('go'), skip=document.getElementById('skip');
  btn.onclick=function(){
    if(btn.dataset.done){ S.event(); return; }
    state.tasks=3; state.rewards=4; progress(); confetti(40);
    document.getElementById('after').innerHTML=
      '<div class="stack sm">'+
        '<div class="note on pop"><b>All three missions done!</b>Nothing left now except turning up.</div>'+
        '<div class="card pop"><span class="label">Their clues, for you</span>'+
          '<div class="found in" style="border-top:0;margin-top:8px"><span class="k">01</span><span class="small">Green jacket, too warm for indoors</span></div>'+
          '<div class="found in"><span class="k">02</span><span class="small">Tall. Annoyingly tall</span></div>'+
          '<div class="found in"><span class="k">03</span><span class="small">Will be the one talking to the staff</span></div></div>'+
        gamePanel()+
      '</div>';
    var r=document.querySelector('#after .ring-wrap'); if(r) MOTION.ring(r,1);
    var c=document.querySelector('#after [data-count]'); if(c) MOTION.countUp(c,Number(c.getAttribute('data-count')),1200);
    btn.textContent='Wait for March'; btn.className='btn ghost'; btn.dataset.done='1';
    skip.style.display='inline-block';
  };
  skip.onclick=S.event;
};

/* 7 — reveal */
S.event=function(){
  splash.classList.add('on');
  setTimeout(function(){ splash.classList.remove('on'); },2400);
  show(
  '<div class="narrow section">'+
    '<span class="tag on" data-rise><span class="dot live"></span> Welcome evening &middot; Helsinki</span>'+
    '<h1 class="display" style="margin-top:22px">Eight weeks. One question.</h1>'+
    '<div id="stage" data-rise="420" style="margin:10px 0 26px">'+
      '<div class="portrait float">'+px(THEM.spec,{level:3})+'</div>'+
      '<h2 class="display" style="margin:26px 0 2px">Meridian</h2>'+
      '<p class="label">Real name still sealed</p>'+
    '</div>'+
    '<div id="after"></div>'+
    '<div style="margin-top:22px"><button class="btn" id="go">Reveal my connection</button></div>'+
  '</div>');
  var btn=document.getElementById('go');
  btn.onclick=function(){
    if(btn.dataset.done){ S.meet(); return; }
    btn.disabled=true;
    var stage=document.getElementById('stage'); var n=3;
    stage.innerHTML='<div class="count">3</div>';
    var iv=setInterval(function(){
      n--;
      if(n>0){ stage.innerHTML='<div class="count">'+n+'</div>'; return; }
      clearInterval(iv);
      stage.innerHTML=
        '<div class="card dark pop" style="text-align:center;padding:34px 22px">'+
          '<span class="label">It was</span>'+
          '<div class="px-tile bare" style="width:160px;margin:16px auto 0">'+px(THEM.spec,{level:3,googly:true})+'</div>'+
          '<h1 class="display" style="margin:22px 0 8px;font-size:clamp(40px,9vw,64px);color:var(--paper)">Alex!</h1>'+
          '<p class="small" style="margin:0;color:rgba(245,244,239,.75)">Metropolia UAS &middot; Tourism Management</p>'+
          '<p class="tiny" style="margin:10px 0 0">Eight weeks as Meridian.</p>'+
        '</div>';
      confetti(90); PIXEL.trackEyes(document);
      setTimeout(function(){
        document.getElementById('after').innerHTML=
          '<div class="note on pop"><b>Look for the red scarf</b>&ldquo;About 1.60m. Hovering near the coffee. Always near the coffee.&rdquo;</div>';
        btn.disabled=false; btn.textContent='Go and find them'; btn.dataset.done='1';
      },950);
    },880);
  };
};

/* 8 — met, reward */
S.meet=function(){
  show(
  '<div class="narrow section">'+
    '<span class="label on" data-rise>Helsinki &middot; Welcome evening</span>'+
    '<h1 class="display" style="margin-top:18px">Found each other!</h1>'+
    '<p class="lead" data-rise="380">Eight weeks of typing. Four seconds of eye contact.</p>'+
    '<div class="card duo" data-rise="430">'+
      '<div class="who"><div class="px-tile bare" style="width:96px;margin:0 auto">'+px(ME.spec,{level:3,googly:true})+'</div>'+
        '<h3 class="display" style="margin:12px 0 0">Emma</h3><span class="tiny">Compass</span></div>'+
      '<div class="label on">met</div>'+
      '<div class="who"><div class="px-tile bare" style="width:96px;margin:0 auto">'+px(THEM.spec,{level:3,googly:true})+'</div>'+
        '<h3 class="display" style="margin:12px 0 0">Alex</h3><span class="tiny">Meridian</span></div>'+
    '</div>'+
    '<div class="card quiet center" style="margin-top:16px" data-rise="480"><span class="label">Next</span>'+
      '<p class="small" style="margin:10px 0 0">Take a photo together. It goes straight into your RESTO passport.</p></div>'+
    '<div id="after" style="margin-top:20px"></div>'+
    '<div style="margin-top:22px"><button class="btn" id="go">We found each other</button></div>'+
  '</div>');
  var btn=document.getElementById('go');
  btn.onclick=function(){
    if(btn.dataset.done){ S.done(); return; }
    state.rewards=5; confetti(120);
    document.getElementById('after').innerHTML=
      '<div class="card on pop"><span class="label on">RESTO passport &middot; stamped</span>'+
        '<h3 class="display" style="margin:8px 0 12px">Mystery connection complete</h3>'+
        '<div class="rewards">'+REWARDS.map(function(r){
          return '<div class="reward got"><span class="ic">'+r.ic+'</span><span>'+r.t+'</span></div>';}).join('')+'</div></div>';
    btn.textContent='Continue'; btn.dataset.done='1';
  };
};

/* 9 — summary */
S.done=function(){
  show(
  '<div class="narrow section">'+
    '<span class="tag" data-rise>Journey complete</span>'+
    '<h1 class="display" style="margin-top:22px">One down. One still waiting.</h1>'+
    '<p class="lead" data-rise="380">Lantern is somewhere in the same room, looking for a red scarf. Fifty-eight strangers after that, which is what the rest of RESTO is for.</p>'+
    '<div data-rise="430">'+gamePanel()+'</div>'+
    '<div class="note" style="margin-top:20px" data-rise="480"><b>What actually happened here</b>Two months of curiosity turned into a conversation that started a long way past small talk. The platform did the waiting. The students did the networking.</div>'+
    '<div style="margin-top:22px"><button class="btn ghost" id="again">Run it again</button></div>'+
  '</div>');
  on('again', reset);
};

/* ---------------------------- controls ---------------------------- */
var ACCENTS=[
  ['Forest','#0E7C5A','#FFFFFF','#E2F0EA'],
  ['Cobalt','#2440D8','#FFFFFF','#E4E8FD'],
  ['Plum','#7B2E63','#FFFFFF','#F3E6EF'],
  ['Teal','#0F6E78','#FFFFFF','#DFF0F2'],
  ['Ink','#14151A','#FFFFFF','#ECEBE6']
];
var sw=document.getElementById('swatches');
ACCENTS.forEach(function(a){
  var b=document.createElement('button');
  b.className='swatch'; b.style.background=a[1]; b.title=a[0]+' '+a[1];
  b.onclick=function(){
    var r=document.documentElement.style;
    r.setProperty('--accent',a[1]); r.setProperty('--accent-ink',a[2]);
    r.setProperty('--accent-soft',a[3]);
    r.setProperty('--accent-line',a[1]+'55');
  };
  sw.appendChild(b);
});

function reset(){ state={tasks:0,rewards:1}; confettiEl.innerHTML=''; splash.classList.remove('on'); S.welcome(); }
document.getElementById('resetBtn').onclick=reset;
document.getElementById('howBtn').onclick=function(){
  alert('Mystery Networking — prototype\n\n'+
    'Three missions open in weeks 3, 5 and 7. Identities are revealed only at the welcome evening in Helsinki.\n\n'+
    'Demo mode removes every wait, so eight weeks takes about ninety seconds. All participants are fictional.\n\n'+
    'The five squares in the top bar switch the accent colour live.\n\n'+
    'Presenting: right arrow or enter advances, R restarts.');
};
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(e.key==='r'||e.key==='R'){ reset(); return; }
  if(e.key==='ArrowRight'||e.key==='Enter'){ var b=app.querySelector('.btn:not([disabled])'); if(b) b.click(); }
});

PIXEL.trackEyes(document);
reset();
})();
</script>
</body>
</html>
