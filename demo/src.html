<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mystery Networking — RESTO 2027</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23FCFCFB'/><rect x='3' y='6' width='3' height='3' fill='%230E0E12'/><rect x='10' y='6' width='3' height='3' fill='%238B5CF6'/></svg>" />
<link rel="stylesheet" href="../public/assets/ui.css" />
<style>
  body{background:var(--paper)}
  .demo-bar{position:sticky;top:0;z-index:60;background:var(--ink);color:rgba(255,255,255,.62);
    font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
  .demo-bar .inner{width:min(480px,100%);margin:0 auto;padding:9px 24px;display:flex;align-items:center;gap:10px}
  .demo-bar button{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.28);
    font:inherit;padding:4px 9px;cursor:pointer;border-radius:2px;transition:.25s var(--ease)}
  .demo-bar button:hover{color:#fff;border-color:#fff}
  .swatches{display:flex;gap:5px}
  .swatch{width:13px;height:13px;border:1px solid rgba(255,255,255,.35);cursor:pointer;padding:0;border-radius:2px}
  .demo-bar button.music{min-width:86px;transition:background .3s var(--ease), color .3s var(--ease)}
  .demo-bar button.music.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .topbar{top:33px}

  .screen{min-height:calc(100svh - 132px);display:flex;flex-direction:column;padding:26px 0 34px}
  .screen .spacer{flex:1;min-height:18px}
  h1.display .serif{font-weight:400}

  .stagecard{display:grid;place-items:center;padding:18px 0}
  .stagecard .inner{width:190px;animation:cardFloat 7s ease-in-out infinite}

  .toastline{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}

  .conn{display:flex;align-items:center;gap:14px;padding:14px;background:var(--paper-2);
    border:1px solid var(--line);border-radius:3px;cursor:pointer;
    transition:transform .4s var(--ease), border-color .3s var(--ease)}
  .conn:hover{transform:translateX(5px)}
  .conn.on{border-color:var(--accent-line);background:var(--accent-soft)}

  .bub{max-width:82%;padding:12px 15px;font-size:14.5px;line-height:1.5;margin-bottom:10px;border-radius:3px;
    background:var(--paper-2);border:1px solid var(--line);opacity:0;transform:translateY(10px);
    transition:.55s var(--ease)}
  .bub.in{opacity:1;transform:none}
  .bub.me{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}

  .found{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);
    opacity:0;transform:translateX(-10px);transition:.55s var(--ease)}
  .found.in{opacity:1;transform:none}
  .found .k{font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--accent);min-width:22px;padding-top:2px}

  .count{font-family:var(--display);font-weight:800;font-size:132px;letter-spacing:-.06em;text-align:center;
    line-height:1.25;color:var(--accent);animation:pop .5s var(--ease) both}

  .splash{position:fixed;inset:0;z-index:80;background:var(--ink);color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;opacity:0;
    pointer-events:none;transition:opacity .6s var(--ease)}
  .splash.on{opacity:1}
  .splash h1{font-size:46px;margin:0;line-height:.98;color:#fff}

  .duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .duo > .label{align-self:center;white-space:nowrap}
  .who{text-align:center}

  /* --- phone is the primary layout; wider screens get a poster beside it --- */
  .shell{display:block}
  .poster{display:none}
  @media (min-width:1040px){
    .shell{display:grid;grid-template-columns:1fr 470px;gap:clamp(40px,6vw,90px);
           width:min(1180px,100%);margin:0 auto;padding:0 40px;align-items:start}
    .poster{display:block;position:sticky;top:150px;padding:44px 0 0}
    .poster h2{font-size:clamp(34px,3.4vw,52px);margin:20px 0 18px;max-width:14ch}
    .poster .lead{max-width:38ch;margin-bottom:26px}
    .poster-cast{display:flex;gap:12px;margin-bottom:26px}
    .poster-cast .px-tile{width:88px}
    .poster-cast .px-tile:nth-child(1){animation:cardFloat 7.2s ease-in-out infinite}
    .poster-cast .px-tile:nth-child(2){animation:cardFloat 8.4s ease-in-out -2s infinite}
    .poster-cast .px-tile:nth-child(3){animation:cardFloat 9.1s ease-in-out -4s infinite}
    .wrap{width:470px;padding:0 0 90px;
          border-left:1px solid var(--line);border-right:1px solid var(--line);
          background:rgba(255,255,255,.55);padding-left:28px;padding-right:28px}
    .screen{min-height:calc(100svh - 150px)}
    .topbar .inner{width:min(1180px,100%);padding:16px 40px}
    .topbar .steps{width:min(1180px,100%) !important;padding-left:40px !important;padding-right:40px !important}
    .demo-bar .inner{width:min(1180px,100%);padding:9px 40px}
  }
  @media (min-width:1040px){
    .topbar .inner .brand{font-size:15px}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<audio id="theme" src="../public/assets/theme.mp3" loop preload="auto"></audio>

<div class="page">
  <div class="demo-bar">
    <div class="inner">
      <button id="musicBtn" class="music">&#9834; Music</button>
      <span class="grow"></span>
      <span class="swatches" id="swatches"></span>
      <button id="howBtn">?</button><button id="resetBtn">Restart</button>
    </div>
  </div>

  <div class="topbar">
    <div class="inner">
      <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span> Mystery Networking</div>
      <span class="grow"></span>
      <span class="label" id="stepLabel">0 / 3</span>
    </div>
    <div class="steps" style="width:min(480px,100%);margin:0 auto;padding:0 24px 12px" id="steps">
      <span class="step"><i></i></span><span class="step"><i></i></span><span class="step"><i></i></span>
    </div>
  </div>

  <div class="shell">
    <aside class="poster">
      <span class="label on">Participant journey</span>
      <h2 class="display">Networking that starts <span class="serif">eight weeks early.</span></h2>
      <p class="lead">Two students from different schools, matched in secret. Three missions. No names until the welcome evening.</p>
      <div class="poster-cast">
        <div class="px-tile"><span id="pc1"></span></div>
        <div class="px-tile"><span id="pc2"></span></div>
        <div class="px-tile"><span id="pc3"></span></div>
      </div>
    </aside>
    <div class="wrap" id="app"></div>
  </div>
</div>

<div class="splash" id="splash">
  <span class="label" style="color:rgba(255,255,255,.5)">12 March 2027</span>
  <h1 class="display">Tonight you <span class="serif">meet them</span>.</h1>
</div>
<div class="confetti" id="confetti"></div>

<script src="../public/assets/pixel.js"></script>
<script src="../public/assets/grain.js"></script>
<script src="../public/assets/motion.js"></script>
<script>
(function(){
"use strict";

GRAIN.speckle(document.getElementById('field'), { density: 1/620, colour:'#101014', seed: 20270312 });
MOTION.pointer();

var cast = PIXEL.catalogue(60);
function h(n){ for(var i=0;i<cast.length;i++) if(cast[i].handle===n) return cast[i]; return cast[0]; }

var ME = { handle:'Compass', real:'Emma',  spec:h('Compass').spec };
var A  = { handle:'Meridian',real:'Alex',  uni:'Metropolia UAS',  spec:h('Meridian').spec,
           clues:['Green jacket, too warm for indoors','Annoyingly tall','Talking to the staff'] };
var B  = { handle:'Lantern', real:'Noor',  uni:'Laurea UAS',      spec:h('Lantern').spec,
           clues:['Yellow tote bag','Shortest person in the room','Will be near the door'] };

var MY_CLUES = [
  'Red scarf, on all evening',
  'About 1.60m',
  'Hovering near the coffee'
];

// characters already claimed by other people, so the wall looks real
function taken(i){ return (i * 7 + 3) % 11 < 4; }

var state = { tasks:0, chosen:null, alias:'Compass', clues:[false,false,false] };

var app = document.getElementById('app');
var stepsEl = document.getElementById('steps');
var stepLabel = document.getElementById('stepLabel');
var splash = document.getElementById('splash');
var confettiEl = document.getElementById('confetti');

function px(spec,opts){ return PIXEL.svg(spec, opts||{}); }
function progress(){
  for(var i=0;i<3;i++) stepsEl.children[i].className='step'+(i<state.tasks?' done':(i===state.tasks?' now':''));
  stepLabel.textContent = state.tasks + ' / 3';
}
function show(html, wire){
  MOTION.transition(function(){
    app.innerHTML = html;
    progress();
    MOTION.observe(app); MOTION.magnetic(app); PIXEL.trackEyes(document);
    var t = app.querySelector('h1.display');
    if(t) requestAnimationFrame(function(){ MOTION.playLines(t,140); });
    var r = app.querySelector('.ring-wrap'); if(r) MOTION.ring(r, state.tasks/3);
    var c = app.querySelector('[data-count]'); if(c) MOTION.countUp(c, Number(c.getAttribute('data-count')), 1200);
    if(wire) wire();
  }, app);
}
function on(id,fn){ var e=document.getElementById(id); if(e) e.onclick=fn; return e; }
function seq(list,cls,gap,done){
  var i=0;(function step(){ if(i>=list.length){ if(done) done(); return; } list[i].classList.add(cls); i++; setTimeout(step,gap); })();
}
function confetti(n){
  var cols=['#8B5CF6','#2FBF87','#F7A8CF','#0E0E12','#FFC93C'];
  for(var i=0;i<(n||60);i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%'; p.style.top=(-16-Math.random()*50)+'px';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.5)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    confettiEl.appendChild(p);
    (function(n){setTimeout(function(){n.remove();},4200);})(p);
  }
}

var S = {};

/* 1 — welcome */
S.welcome = function(){
  show(
  '<div class="screen">'+
    '<span class="label" data-rise>RESTO 2027 &middot; Helsinki</span>'+
    '<h1 class="display" style="margin-top:18px">Two people at RESTO are about to <span class="serif">meet you</span>.</h1>'+
    '<div class="stagecard" data-rise="420"><div class="inner">'+px(ME.spec,{level:3,googly:true})+'</div></div>'+
    '<div class="spacer"></div>'+
    '<p class="lead" data-rise="520" style="margin-bottom:6px">You will not know who they are. They will not know who you are.</p>'+
    '<p class="lead" data-rise="560" style="color:var(--accent);font-weight:600;margin-bottom:18px">HUOM! Keep it that way until Helsinki.</p>'+
    '<div data-rise="600"><button class="btn wide" id="go">Create my account</button></div>'+
  '</div>', function(){ on('go', S.character); });
};

/* 2 — claim a character */
S.character = function(){
  var free = cast.filter(function(c,i){ return !taken(i); });
  show(
  '<div class="screen">'+
    '<div class="spread" data-rise><span class="label on">Week 1 &middot; set up</span>'+
      '<span class="label" id="count">'+free.length+' / 60 free</span></div>'+
    '<h1 class="display" style="margin-top:16px">Pick who you will be until <span class="serif">Helsinki</span>.</h1>'+
    '<p class="lead" data-rise="380">This is all anyone sees for the next eight weeks. One character per person, and once it is taken it is gone.</p>'+
    '<div class="tile-grid" id="grid" data-rise="420"></div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go" disabled>Continue</button>'+
  '</div>', function(){
    var grid = document.getElementById('grid'), btn = document.getElementById('go');
    grid.innerHTML = cast.map(function(c,i){
      return '<div class="tile'+(taken(i)?' gone':'')+'" data-h="'+c.handle+'">'+
        px(c.spec,{level:3, googly:!taken(i)})+'<span class="nm">'+c.handle+'</span></div>';
    }).join('');
    grid.onclick = function(e){
      var tile = e.target.closest('.tile');
      if(!tile || tile.classList.contains('gone')) return;
      state.alias = tile.dataset.h;
      ME.spec = h(state.alias).spec;
      grid.querySelectorAll('.tile').forEach(function(t){ t.classList.toggle('sel', t.dataset.h===state.alias); });
      btn.disabled = false;
    };
    btn.onclick = S.profile;
  });
};

/* 3 — the sealed half */
S.profile = function(){
  show(
  '<div class="screen">'+
    '<span class="label on" data-rise>Week 1 &middot; set up</span>'+
    '<h1 class="display" style="margin-top:16px">Now the part <span class="serif">nobody sees</span>.</h1>'+
    '<p class="lead" data-rise="380">Your real name and photo are sealed until the welcome evening. They exist so people can actually find each other on the night.</p>'+
    '<div class="card row" data-rise="420">'+
      '<div class="px-tile" style="width:76px;flex:0 0 auto">'+px(ME.spec,{level:3,googly:true})+'</div>'+
      '<div><span class="label">Your character</span>'+
        '<h3 class="display" style="margin:4px 0 0">'+state.alias+'</h3></div>'+
    '</div>'+
    '<div class="stack sm" style="margin-top:16px" data-rise="460">'+
      '<label class="field"><span class="label">Mystery name &middot; everyone sees this</span>'+
        '<input type="text" value="'+state.alias+'" /></label>'+
      '<label class="field"><span class="label">Real name &middot; sealed</span>'+
        '<input type="text" value="Emma Virtanen" /></label>'+
      '<div><span class="label" style="display:block;margin-bottom:8px">Photo &middot; sealed</span>'+
        '<div class="row"><button class="btn ghost" id="photo">Add a photo</button>'+
        '<span class="tiny" id="photostate">No photo yet</span></div></div>'+
    '</div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go">Save and continue</button>'+
  '</div>', function(){
    on('photo', function(){
      document.getElementById('photostate').innerHTML = '<span style="color:var(--mint);font-weight:600">Added &mdash; sealed until March</span>';
    });
    on('go', S.wall);
  });
};

/* 4 — the picking wall */
S.wall = function(){
  var free = cast.filter(function(c,i){ return !taken(i) && c.handle!==state.alias; });
  show(
  '<div class="screen">'+
    '<div class="spread" data-rise><span class="label on">Week 2 &middot; first come, first served</span>'+
      '<span class="label">'+(60-free.length)+' taken</span></div>'+
    '<h1 class="display" style="margin-top:16px">Pick <span class="serif">one person</span>.</h1>'+
    '<p class="lead" data-rise="380">'+free.length+' people are still free. You get one pick, and you can be picked once — so most people end up with two connections.</p>'+
    '<div class="tile-grid" id="grid" data-rise="420"></div>'+
    '<div class="spacer"></div>'+
    '<div class="note" data-rise="460"><b>No take-backs</b>Whoever gets there first gets them. If someone disappears from the wall, you were too slow.</div>'+
  '</div>', function(){
    var grid = document.getElementById('grid');
    grid.innerHTML = free.map(function(c){
      var mine = c.handle===A.handle;
      return '<div class="tile'+(mine?' sel':'')+'" data-h="'+c.handle+'">'+
        px(c.spec,{level:3,googly:true})+'<span class="nm">'+c.handle+'</span></div>';
    }).join('');
    grid.onclick = function(e){
      var tile = e.target.closest('.tile'); if(!tile) return;
      S.picked(tile.dataset.h);
    };
  });
};

/* 5 — picked, and picked back */
S.picked = function(handle){
  var who = h(handle);
  A.handle = who.handle; A.spec = who.spec;
  show(
  '<div class="screen">'+
    '<span class="label on" data-rise>Week 2</span>'+
    '<h1 class="display" style="margin-top:16px">You picked <span class="serif">'+A.handle+'</span>!</h1>'+
    '<div class="stagecard" data-rise="400"><div class="inner">'+px(A.spec,{level:3,googly:true})+'</div></div>'+
    '<div id="after"></div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go">See my connections</button>'+
  '</div>', function(){
    setTimeout(function(){
      var el = document.getElementById('after');
      if(!el) return;
      el.innerHTML = '<div class="note on pop"><b>And '+B.handle+' picked you!</b>Two people to talk to now, and neither of them has any idea who you are.</div>';
      confetti(30);
    }, 1400);
    on('go', S.connections);
  });
};

/* 6 — both connections + the rule */
S.connections = function(){
  show(
  '<div class="screen">'+
    '<span class="label on" data-rise>Week 2</span>'+
    '<h1 class="display" style="margin-top:16px">Two strangers, <span class="serif">both yours</span>.</h1>'+
    '<div class="stack sm" data-rise="400">'+
      '<div class="conn on"><div class="px-tile bare" style="width:54px;flex:0 0 auto">'+px(A.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">'+A.handle+'</h3><span class="label">You picked them</span></div></div>'+
      '<div class="conn"><div class="px-tile bare" style="width:54px;flex:0 0 auto">'+px(B.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">'+B.handle+'</h3><span class="label">They picked you</span></div></div>'+
    '</div>'+
    '<div class="spacer"></div>'+
    '<div class="note on" data-rise="460" style="margin-bottom:18px">'+
      '<b>&#9888;&#65039; HOUSE RULE</b>NO NAMES. NO SCHOOLS. NO PHOTOS. If it slips out, you have spoiled your own reveal.</div>'+
    '<button class="btn wide" id="go">Start talking</button>'+
  '</div>', function(){ on('go', function(){ S.choose(1); }); });
};

/* 7 — which of the two are you doing this with */
S.choose = function(mission){
  var other = mission === 2 ? A : B;      // the demo alternates, to show both threads
  var pick  = mission === 2 ? B : A;
  show(
  '<div class="screen">'+
    '<span class="label on" data-rise>Mission 0'+mission+' &middot; week '+(mission===1?3:5)+'</span>'+
    '<h1 class="display" style="margin-top:16px">Who are you doing this one <span class="serif">with</span>?</h1>'+
    '<p class="lead" data-rise="380">Every mission is done separately with each connection. Two conversations, two sets of answers.</p>'+
    '<div class="stack sm" data-rise="420">'+
      '<div class="conn on" id="p1"><div class="px-tile bare" style="width:54px;flex:0 0 auto">'+px(pick.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">'+pick.handle+'</h3>'+
        '<span class="label">'+(pick===A?'You picked them':'They picked you')+'</span></div>'+
        '<span class="label on">To do</span></div>'+
      '<div class="conn" id="p2"><div class="px-tile bare" style="width:54px;flex:0 0 auto">'+px(other.spec,{level:3,googly:true})+'</div>'+
        '<div class="grow"><h3 class="display" style="margin:0">'+other.handle+'</h3>'+
        '<span class="label">'+(other===A?'You picked them':'They picked you')+'</span></div>'+
        '<span class="label">Later</span></div>'+
    '</div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go">Open '+pick.handle+'</button>'+
  '</div>', function(){
    var next = mission===1 ? S.mission1 : S.mission2;
    on('go', next); document.getElementById('p1').onclick = next;
  });
};

/* 8 — mission one, through the chat */
S.mission1 = function(){
  show(
  '<div class="screen">'+
    '<div class="spread" data-rise><span class="label on">Mission 01 &middot; week 3</span>'+
      '<span class="label">With '+A.handle+'</span></div>'+
    '<h1 class="display" style="margin-top:16px">Find three things you <span class="serif">both like</span>.</h1>'+
    '<p class="lead" data-rise="380">Anything at all, as long as you both mean it. Just talk until you get there.</p>'+
    '<div id="chat" data-rise="420">'+
      '<div class="bub">eight weeks of this and i cannot even ask your name</div>'+
      '<div class="bub me">ask me something better then</div>'+
      '<div class="bub">fine. dog or no dog</div>'+
      '<div class="bub me">golden retriever. eleven years old. do not get me started</div>'+
      '<div class="bub">oh no. mine is nine. we are going to be unbearable about this</div>'+
    '</div>'+
    '<div class="card" id="found" style="margin-top:6px" data-rise="460">'+
      '<span class="label">Found together</span>'+
      '<div class="found" style="margin-top:6px"><span class="k">01</span><span class="small">Both have a golden retriever</span></div>'+
      '<div class="found"><span class="k">02</span><span class="small">Both interrailed last summer</span></div>'+
      '<div class="found"><span class="k">03</span><span class="small">Neither can cook anything but pasta</span></div>'+
    '</div>'+
    '<div id="after" style="margin-top:16px"></div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go">Play the conversation</button>'+
  '</div>', function(){
    var b = document.getElementById('go');
    b.onclick = function(){
      if(b.dataset.done){ S.choose(2); return; }
      b.disabled = true; b.textContent='Talking…';
      seq([].slice.call(document.querySelectorAll('.bub')),'in',620,function(){
        seq([].slice.call(document.querySelectorAll('.found')),'in',520,function(){
          state.tasks = 1; progress(); confetti(26);
          document.getElementById('after').innerHTML =
            '<div class="note on pop"><b>Three things!</b>Not bad for two strangers.</div>';
          b.disabled=false; b.textContent='Next mission'; b.dataset.done='1';
        });
      });
    };
  });
};

/* 9 — mission two, with the other one */
S.mission2 = function(){
  show(
  '<div class="screen">'+
    '<div class="spread" data-rise><span class="label on">Mission 02 &middot; week 5</span>'+
      '<span class="label">With '+B.handle+'</span></div>'+
    '<h1 class="display" style="margin-top:16px">Two truths and <span class="serif">a lie</span>.</h1>'+
    '<p class="lead" data-rise="380">Two true, one invented. See if they can spot it.</p>'+
    '<div class="stack sm" data-rise="420">'+
      '<input type="text" value="I have broken the same finger three times" />'+

    '<p class="lead" data-rise="380">Five minutes, one room, three hundred people. Tap each one and be specific.</p>'+
    '<div class="clues" data-rise="420" id="clues">'+
      [0,1,2].map(function(i){
        return '<div class="clue" data-i="'+i+'"><div class="ringbox">0'+(i+1)+'</div>'+
               '<div class="cap">Clue '+(i+1)+'</div></div>';

    '</div>'+
    '<div id="after" style="margin-top:20px"></div>'+
    '<div class="spacer"></div>'+
    '<button class="btn wide" id="go" disabled>Send my clues</button>'+

};

  };

/* Background music for presenting. Browsers only allow audio after a real
   click, so it is a button rather than something that starts on its own. */
var theme = document.getElementById('theme');
var musicBtn = document.getElementById('musicBtn');
var fadeTimer = null;
function fadeTo(target, done){
  clearInterval(fadeTimer);
  fadeTimer = setInterval(function(){
    var v = theme.volume;
    if (Math.abs(v - target) < 0.03) {
      theme.volume = target; clearInterval(fadeTimer); if (done) done(); return;
    }
    theme.volume = v + (target - v) * 0.18;
  }, 40);
}
musicBtn.onclick = function(){
  if (theme.paused) {
    theme.volume = 0;
    theme.play().then(function(){
      musicBtn.classList.add('on');
      musicBtn.innerHTML = '&#9834; Playing';
      fadeTo(0.32);
    }).catch(function(){
      musicBtn.innerHTML = '&#9834; Blocked';
    });
  } else {
    fadeTo(0, function(){ theme.pause(); });
    musicBtn.classList.remove('on');
    musicBtn.innerHTML = '&#9834; Music';
  }
};

function reset(){
  state={tasks:0,chosen:null,alias:'Compass',clues:[false,false,false]};
  ME.spec = h('Compass').spec;
  A.handle='Meridian'; A.spec=h('Meridian').spec;
  confettiEl.innerHTML=''; splash.classList.remove('on');
  S.welcome();
}
document.getElementById('resetBtn').onclick = reset;
document.getElementById('howBtn').onclick = function(){

    'Everyone gets two connections: the person they pick, and the person who picks them. '+
    'Three missions open in weeks 3, 5 and 7, and identities are revealed only at the welcome evening in Helsinki.\n\n'+
    'Demo mode removes every wait. All participants are made up.\n\n'+
    'The five squares switch the accent colour live, and the note button starts the background music.');
};
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='r'||e.key==='R'){ reset(); return; }
  if(e.key==='ArrowRight'||e.key==='Enter'){ var b=app.querySelector('.btn:not([disabled])'); if(b) b.click(); }
});
